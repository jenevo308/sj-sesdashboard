name: Update SES data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # off-peak minutes; GitHub still may delay or skip runs
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Previous output, so a failed feed keeps its last good data (flagged stale)
      - name: Get previous data
        run: |
          git fetch origin data --depth=1 2>/dev/null \
            && git show origin/data:live.json > prev.json \
            || echo '{}' > prev.json

      - name: Fetch BOM + Emergency WA
        run: node scripts/fetch-data.mjs --prev prev.json --out out/live.json

      # Single-commit orphan branch: no history build-up on main
      - name: Publish to data branch
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git config user.name  "ses-dashboard-bot"
          git config user.email "ses-dashboard-bot@users.noreply.github.com"
          git add live.json
          git commit -qm "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
